# Pinned versions for the OpenG2P local developer stack.
# Override individual refs in .env if needed.
#
# Application image pins below are the single source of truth for Docker Compose.
# Sync into .env with: make sync-images

workspace:
  default_path: ../openg2p-workspace

repos:
  odoo:
    url: https://github.com/odoo/odoo.git
    ref: "17.0"
    path: odoo17

  pbms:
    url: https://github.com/OpenG2P/pbms.git
    ref: develop
    path: pbms

  odoo_commons:
    url: https://github.com/OpenG2P/openg2p-odoo-commons.git
    ref: develop
    path: openg2p-odoo-commons

  registry_platform:
    url: https://gitlab.com/openg2p/registry/registry-platform.git
    ref: "1.2"
    path: registry-platform

  iam_service:
    url: https://github.com/OpenG2P/iam-service.git
    ref: develop
    path: iam-service

  master_data_service:
    url: https://gitlab.com/openg2p/master-data-service.git
    ref: develop
    path: master-data-service

  openg2p_data:
    url: https://github.com/OpenG2P/openg2p-data.git
    ref: develop
    path: openg2p-data

  farmer_registry:
    url: https://gitlab.com/openg2p/registry/farmer-registry.git
    ref: "1.3"
    path: farmer-registry
    extension_path: farmer-extension

  national_social_registry:
    url: https://gitlab.com/openg2p/registry/national-social-registry.git
    ref: "1.1"
    path: national-social-registry
    extension_path: nsr-extension

  g2p_bridge:
    url: https://github.com/OpenG2P/g2p-bridge.git
    ref: develop
    path: g2p-bridge

  spar:
    url: https://github.com/OpenG2P/spar.git
    ref: develop
    path: spar

  awe:
    url: https://gitlab.com/openg2p/awe.git
    ref: develop
    path: awe

images:
  # Catalog / shared hub (app launcher with links to Farmer, NSR, …)
  staff_portal_ui: openg2p/openg2p-staff-portal-ui:0.0.0-develop.54

  # Shared registry product UI image (Farmer + NSR each run their own container)
  registry_staff_portal_ui: openg2p/openg2p-registry-staff-portal-ui:1.1.1

  # Commons
  iam_staff_portal_api: openg2p/iam-staff-portal-api:1.3.0
  master_data_api: openg2p/openg2p-gen2-master-data-api:1.0.1
  awe_api: openg2p/openg2p-awe:1.2.0
  awe_ui: openg2p/openg2p-awe-ui:1.2.0

  # Farmer Registry
  farmer_registry_staff_api: openg2p/openg2p-farmer-registry-staff-api:1.2.0
  farmer_registry_partner_api: openg2p/openg2p-farmer-registry-partner-api:1.2.0
  farmer_registry_celery: openg2p/openg2p-farmer-registry-celery:1.2.0
  farmer_registry_db_seed: openg2p/openg2p-farmer-registry-db-seed:1.2.0

  # National Social Registry
  nsr_staff_api: openg2p/openg2p-nsr-staff-api:1.0.1
  nsr_partner_api: openg2p/openg2p-nsr-partner-api:1.0.1
  nsr_celery: openg2p/openg2p-nsr-celery:1.0.1
  nsr_db_seed: openg2p/openg2p-nsr-db-seed:1.0.1

  # Other stack images
  pbms: openg2p/openg2p-pbms-core:develop
  g2p_bridge_partner_api: openg2p/g2p-bridge-partner-api:develop
  g2p_bridge_bene_api: openg2p/g2p-bridge-bene-portal-api:develop
  g2p_bridge_celery: openg2p/g2p-bridge-celery:develop
  g2p_bridge_example_bank: openg2p/openg2p-g2p-bridge-example-bank-api:develop
  postgres: postgres:16
  redis: redis:7-alpine
  minio: minio/minio:latest
  keycloak: quay.io/keycloak/keycloak:26.0
  id_generator: openg2p/openg2p-id-generator:1.0.0

profiles:
  infra:
    description: Shared Postgres, Redis, MinIO, Keycloak
    compose_profiles: [infra]

  commons:
    description: Shared IAM + AWE containers for registry Docker stacks
    requires: [infra]
    compose_profiles: [infra, with-redis, commons]

  pbms:
    description: PBMS Odoo (native or container)
    requires: [infra]
    compose_profiles: [infra, pbms]

  farmer_registry:
    description: Farmer Registry Gen2 (platform + farmer-extension)
    requires: [infra, commons]
    compose_profiles: [infra, with-redis, commons, farmer-registry]

  national_social_registry:
    description: National Social Registry Gen2 (platform + nsr-extension)
    requires: [infra, commons]
    compose_profiles: [infra, with-redis, commons, nsr-registry]

  bridge:
    description: G2P Bridge APIs, Celery, example bank
    requires: [infra]
    compose_profiles: [infra, bridge]

  spar:
    description: SPAR mapper and beneficiary portal APIs
    requires: [infra]
    compose_profiles: [infra, spar]

  awe:
    description: Approval Workflow Engine for registry CR/intake approvals
    requires: [infra]
    compose_profiles: [infra, commons]

  docker_registry:
    description: Docker-only Farmer + NSR + IAM + AWE
    requires: [infra, commons]
    compose_profiles: [infra, with-redis, commons, farmer-registry, nsr-registry]

  full:
    description: All infrastructure and containerized apps
    requires: [infra, commons, pbms, farmer_registry, national_social_registry, bridge, spar]
    compose_profiles: [infra, with-redis, commons, pbms, farmer-registry, nsr-registry, bridge, spar]
